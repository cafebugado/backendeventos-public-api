version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Só propõe versões publicadas há pelo menos 7 dias. Pacotes comprometidos
    # costumam ser descobertos e retirados do npm nos primeiros dias; a espera
    # evita que um deles chegue ao CI, às máquinas de quem contribui ou à Vercel.
    # Correções de segurança (Dependabot security updates) não esperam.
    cooldown:
      default-days: 7
    groups:
      # Os pacotes @nestjs/* exigem uns aos outros na MESMA major (ex.:
      # @nestjs/core@12 pede @nestjs/common@^12). Um PR por pacote nunca
      # instala (ERESOLVE), então eles sempre sobem juntos, de produção e dev.
      nestjs:
        patterns:
          - "@nestjs/*"
      # O ESLint e o @eslint/js precisam estar na mesma major (o @eslint/js 10
      # sozinho falha, como no #104), e os plugins acompanham. Fica antes do
      # grupo dev-dependencies, porque o Dependabot usa o PRIMEIRO grupo que casa.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-config-*"
          - "eslint-plugin-*"
      # Só minor/patch em grupo. Uma major junto com atualizações seguras
      # derruba o grupo inteiro (foi o caso do #87, com TypeScript 7 e
      # ESLint 10). As majors chegam em PRs individuais, para avaliar cada uma.
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        exclude-patterns:
          - "@nestjs/*"
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-config-*"
          - "eslint-plugin-*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # O TypeScript 7 ainda não é aceito pelo typescript-eslint (<6.1) nem pelo
      # @nestjs/swagger (^5.5 || ^6). Liberar quando os dois aceitarem.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # @types/node deve acompanhar o Node usado em runtime (22, ver .nvmrc),
      # não a versão mais recente do Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Prisma está fixado em 6.19.3 por decisão do time — não queremos que o
      # Dependabot proponha o salto de major para o Prisma 7 (breaking changes
      # de configuração, ver notas do workflow de CI). Patches/minors dentro do
      # 6.x continuam liberados.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Mesma espera das dependências npm: uma action comprometida roda no CI com
    # acesso aos secrets do repositório.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
