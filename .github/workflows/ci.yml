name: CI

on:
  pull_request:
    branches:
      - production
      - development
  push:
    branches:
      - production
      - development

permissions:
  contents: read

# Em PR, cancela execuções antigas quando um novo push chega — evita gastar
# minutos de CI rodando um commit que já foi substituído.
# Em push para development/production NÃO cancela: o job `release` pode estar
# no meio da criação de uma tag/release, e interromper deixaria uma tag sem
# release. As execuções ficam em fila; se uma chegar com a branch já
# desatualizada, o semantic-release apenas pula e a próxima publica tudo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Não precisa de DATABASE_URL/DIRECT_URL: no Prisma 6.x o `generate` só
      # lê o schema.prisma, não valida nem resolve as env vars do datasource.
      # (Isso mudou no Prisma 7 — não se aplica aqui, o projeto está fixado em 6.19.3.)
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint (no --fix)
        run: npm run lint:check

      # Mesma checagem do pre-commit, mas no repositório inteiro: pega também
      # quem commitou com --no-verify ou sem os hooks instalados.
      - name: Procurar credenciais versionadas
        run: npm run check:secrets

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # test:cov já tem os thresholds de cobertura (80% por arquivo) no
      # vitest.config.ts para events/tags/contributors/gallery — o próprio
      # `vitest run --coverage` falha (exit code != 0) se ficar abaixo disso.
      - name: Run unit tests with coverage
        run: npm run test:cov

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    # Os e2e-specs sobem o AppModule inteiro via TestingModule (ver
    # test/test-app.helper.ts), o que dispara a validação de env do
    # ConfigModule.forRoot() antes mesmo de qualquer mock do Prisma entrar em
    # ação. Não existe .env no runner (é gitignorado, nunca commitado), então
    # precisamos de valores fake aqui — a conexão real nunca é aberta, o
    # PrismaService é sempre sobrescrito por um mock nos testes e2e.
    env:
      CORS_ORIGINS: 'http://localhost:3000'
      DATABASE_URL: 'postgresql://user:password@localhost:5432/postgres'
      DIRECT_URL: 'postgresql://user:password@localhost:5432/postgres'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run e2e tests
        run: npm run test:e2e

  # O banco local do docker compose é criado a partir de um SQL gerado do
  # prisma/schema.prisma. Se alguém muda o schema e esquece de regenerar, o
  # ambiente local dos voluntários fica diferente da produção — este job pega.
  db-schema:
    name: db-schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Conferir docker/postgres/init/01-schema.sql
        run: npm run db:schema:check

  # Único teste contra um Postgres DE VERDADE (os demais mockam o Prisma): sobe
  # o banco local com o seed, inicia a API compilada e roda o smoke test. Pega
  # SQL cru quebrado, seed incompatível com o schema e vazamento de evento não
  # publicado — e garante que o `npm run db:up` dos voluntários funciona.
  smoke-local:
    name: smoke-local
    runs-on: ubuntu-latest
    env:
      PORT: '3000'
      CORS_ORIGINS: 'http://localhost:3000'
      DATABASE_URL: 'postgresql://public_api_readonly:readonly_local@localhost:5433/postgres'
      DIRECT_URL: 'postgresql://public_api_readonly:readonly_local@localhost:5433/postgres'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Subir Postgres local (schema + seed)
        run: npm run db:up

      - name: Build
        run: npm run build

      - name: Iniciar API e aguardar /health
        run: |
          node dist/main > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "API não respondeu em 30s"; cat api.log; exit 1

      - name: Smoke test
        run: npm run test:smoke

      - name: Logs em caso de falha
        if: failure()
        run: |
          docker compose logs db
          cat api.log || true

  # Gera a release a partir dos commits (Conventional Commits) depois que todo
  # o CI passou. Só roda em push (merge de PR) para development/production:
  #   development → pré-release vX.Y.Z-dev.N
  #   production  → release estável vX.Y.Z (latest)
  # Configuração em .releaserc.json; detalhes no CONTRIBUTING.md.
  release:
    name: release
    if: github.event_name == 'push'
    needs: [lint, build, unit-tests, e2e-tests, db-schema, smoke-local]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # O GITHUB_TOKEN deste job continua somente leitura: tag, release e PR de
    # sincronização são criados com o token do GitHub App, para que o evento
    # `release: published` dispare o workflow do Discord e o PR rode o CI
    # (ações feitas com o GITHUB_TOKEN não disparam outros workflows).
    permissions:
      contents: read
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Gerar token do GitHub App
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # precisa do histórico e das tags para calcular a versão
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

      # A tag estável fica no merge commit de production, que não existe em
      # development. Sem trazer production de volta, as próximas pré-releases
      # continuariam na versão antiga (ex.: v0.1.0-dev.4 depois da v0.2.0).
      # Por isso, a cada release estável, abre um PR production → development
      # (que deve entrar com MERGE COMMIT, nunca squash).
      - name: Abrir PR de sincronização production → development
        if: github.ref == 'refs/heads/production'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          # Tag estável (sem sufixo -dev.N) criada pelo semantic-release neste commit
          TAG=$(git tag --points-at HEAD --list 'v*' | { grep -v -- '-' || true; } | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "Nenhuma release estável neste commit; nada para sincronizar."
            exit 0
          fi
          AHEAD=$(gh api "repos/${{ github.repository }}/compare/development...production" --jq '.ahead_by')
          if [ "$AHEAD" = "0" ]; then
            echo "development já contém production; nada para sincronizar."
            exit 0
          fi
          OPEN=$(gh pr list --base development --head production --state open --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "Já existe um PR de sincronização aberto."
            exit 0
          fi
          gh pr create --base development --head production \
            --title "chore: sincroniza production em development ($TAG)" \
            --body "Traz a release **$TAG** de \`production\` de volta para \`development\`.

          Sem este merge, as próximas pré-releases de \`development\` continuariam calculando a versão a partir da release anterior.

          > ⚠️ Fazer o merge com **Create a merge commit** (nunca squash), senão a tag \`$TAG\` não passa a fazer parte do histórico de \`development\`.

          _PR aberto automaticamente pelo job \`release\` do CI._"
